name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:

  # =========================================================================
  # Gate job: portability fence + unit tests. Gates all build jobs.
  # The fence is a grep that runs before npm ci, so a coupling leak fails
  # in seconds, not minutes. Unit tests use the real loader + stub adapters.
  # =========================================================================
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - name: Portability fence
        run: bash scripts/check-portability.sh
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://npm.pkg.github.com'
      - name: Install and test
        working-directory: src/_test
        run: |
          npm ci
          npm test

  # =========================================================================
  # Gate job: ESLint via shared config. Runs in parallel with test.
  # =========================================================================
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://npm.pkg.github.com'
      - name: Install and lint
        run: |
          npm ci
          npm run lint
      - name: G25 - Prose mechanics (no British spelling, em dash, or banned vocabulary)
        run: |
          hits=$(git grep -niE "colour|behaviour|recognis|initialis|optimise|optimisation" -- . ':(exclude)*/node_modules/*' ':(exclude).github/*' ':(exclude)*package-lock.json' 2>/dev/null || true)
          if [ -n "$hits" ]; then
            echo "FAIL: British spelling found. Use American English (color, behavior, recognize, initialize, optimize)."
            echo "$hits"
            exit 1
          fi
          em=$(git grep -n "—" -- . ':(exclude)*/node_modules/*' ':(exclude).github/*' ':(exclude)*package-lock.json' 2>/dev/null || true)
          if [ -n "$em" ]; then
            echo "FAIL: em dash found. Use a comma, a period, or ' - ' instead."
            echo "$em"
            exit 1
          fi
          echo "PASS: no British spelling or em dash in tracked files"
      - name: G26 - Peer-dep utilization (use Lib.Utils primitives, not raw length/keys checks)
        run: |
          hits=$(git grep -nE "\.length (===|!==|>) 0|(===|!==) ''|Object\.keys\([^)]+\)\.length (===|!==|>) 0" -- '*.js' '*.jsx' ':(exclude)*/node_modules/*' ':(exclude).github/*' ':(exclude)src/_test/*' ':(exclude)src/app-core/loader.validators.js' ':(exclude)scripts/*' 2>/dev/null || true)
          if [ -n "$hits" ]; then
            echo "FAIL: raw length or keys check found. Use Lib.Utils.isEmptyArray, isEmptyObject, or isEmptyString."
            echo "$hits"
            exit 1
          fi
          echo "PASS: no raw length or keys checks in module source"

  # =========================================================================
  # Build jobs: all depend on test, run in parallel.
  # =========================================================================

  # Expo web export via Metro bundler
  expo-web:
    needs: [test, lint]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://npm.pkg.github.com'
      - name: Expo web export
        working-directory: hosts/expo
        run: |
          npm ci
          npx expo export --platform web --output-dir dist
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: expo-web
          path: hosts/expo/dist
          retention-days: 7

  # React Native Web build via Vite: proves src/ has no framework coupling
  rnw-web:
    needs: [test, lint]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://npm.pkg.github.com'
      - name: Vite build
        working-directory: hosts/web
        run: |
          npm ci
          npx vite build
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: rnw-web
          path: hosts/web/dist
          retention-days: 7

  # Playwright E2E: builds the web host and runs browser tests against all
  # app shapes (launcher, tasks, notes, showcase galleries).
  e2e:
    needs: [test, lint]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://npm.pkg.github.com'
      - name: Install root deps
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Install and build web host
        working-directory: hosts/web
        run: |
          npm ci
          npx vite build
      - name: Run E2E
        run: npx playwright test
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7

  # Expo Android: prebuild generates native project, Gradle compiles debug APK
  expo-android:
    needs: [test, lint]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GRADLE_OPTS: -Xmx4g
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://npm.pkg.github.com'
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Install and prebuild
        working-directory: hosts/expo
        run: |
          npm ci
          npx expo prebuild --platform android
      - name: Assemble debug APK
        working-directory: hosts/expo/android
        run: ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: expo-android-apk
          path: hosts/expo/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

  # Expo iOS: prebuild generates native project, pod install, xcodebuild compile.
  # Repo is public, so macOS runners are free and unlimited.
  expo-ios:
    needs: [test, lint]
    runs-on: macos-latest
    permissions:
      contents: read
      packages: read
    env:
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://npm.pkg.github.com'
      - name: Install and prebuild
        working-directory: hosts/expo
        run: |
          npm ci
          npx expo prebuild --platform ios
      - name: Install pods
        working-directory: hosts/expo/ios
        run: pod install
      - name: Build iOS (unsigned)
        working-directory: hosts/expo/ios
        run: |
          WORKSPACE=$(find . -maxdepth 1 -name "*.xcworkspace" -print -quit)
          if [ -z "$WORKSPACE" ]; then
            echo "No .xcworkspace found in hosts/expo/ios"
            ls -la
            exit 1
          fi
          echo "Workspace: $WORKSPACE"
          SCHEME=$(xcodebuild -list -workspace "$WORKSPACE" 2>/dev/null | awk '/Schemes:/{found=1;next} found && NF{print $1;exit}')
          if [ -z "$SCHEME" ]; then
            echo "No scheme found in $WORKSPACE"
            xcodebuild -list -workspace "$WORKSPACE"
            exit 1
          fi
          echo "Scheme: $SCHEME"
          xcodebuild -workspace "$WORKSPACE" -scheme "$SCHEME" -configuration Debug -sdk iphonesimulator CODE_SIGNING_ALLOWED=NO
